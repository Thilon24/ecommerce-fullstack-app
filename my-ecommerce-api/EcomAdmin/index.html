<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans overflow-x-hidden">

    <!-- Mobile Top Bar -->
    <div class="lg:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
        <span class="font-bold uppercase tracking-wider text-blue-400">E-com Admin</span>
        <button id="menuBtn" class="text-2xl focus:outline-none">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="flex h-screen relative">

        <!-- Sidebar -->
        <div id="sidebar"
            class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 ease-in-out flex flex-col shrink-0">
            <div
                class="p-6 text-2xl font-bold border-b border-slate-700 uppercase tracking-wider text-blue-400 flex justify-between items-center">
                STHUB ADMIN PANEL
                <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="flex-1 mt-4">
                <a href="dashboard.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-chart-line mr-3 w-5"></i> Dashboard
                </a>
                <a href="index.html" class="flex items-center px-6 py-3 bg-blue-600 text-white shadow-lg">
                    <i class="fas fa-plus-circle mr-3 w-5"></i> Add Product
                </a>
                <a href="products.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-box mr-3 w-5"></i> All Products
                </a>
                <a href="orders.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-shopping-cart mr-3 w-5"></i> Orders
                </a>
                <a href="messages.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-comment-dots mr-3 w-5"></i> Messages
                </a>
            </nav>
        </div>

        <!-- Overlay for Mobile Sidebar -->
        <div id="overlay" class="fixed inset-0 bg-black opacity-50 z-40 hidden lg:hidden"></div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto p-4 md:p-10">
            <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-6 md:mb-8">Add New Product</h1>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 max-w-4xl mx-auto lg:mx-0">
                <!-- FORM START -->
                <form id="addProductForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
                            <input type="text" id="pName" placeholder="Enter product name"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                                required>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
                            <select id="pCategory"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                                <option>Kids Collection</option>
                                <option>Camera</option>
                                <option>Women</option>
                                <option>Shoes</option>
                                <option>Watches</option>
                                <option>Men</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Price (LKR)</label>
                            <input type="number" id="pPrice" placeholder="e.g. 5500"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                                required>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Product Type</label>
                            <select id="pType"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                                <option>New Products</option>
                                <option>Popular Products</option>
                            </select>
                        </div>

                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                            <textarea id="pDesc" rows="4" placeholder="Briefly describe the product..."
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></textarea>
                        </div>

                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Product Image</label>
                            <div
                                class="relative group cursor-pointer border-2 border-dashed border-gray-300 rounded-xl p-4 hover:border-blue-400 transition text-center">
                                <input type="file" id="pImgFile" accept="image/*"
                                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <div class="text-gray-500 py-2">
                                    <i class="fas fa-cloud-upload-alt text-3xl mb-2 text-blue-500"></i>
                                    <p class="text-xs md:text-sm font-medium">Click to upload or drag and drop</p>
                                    <p class="text-[10px] text-gray-400">PNG, JPG or WEBP (Max 2MB)</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="submitBtn"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-300 transform active:scale-95">
                            <i class="fas fa-plus-circle mr-2"></i> Add Product Now
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Script -->
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeSidebar = document.getElementById('closeSidebar');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeSidebar.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>

    <script type="module" src="script.js"></script>
</body>

</html>
