<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans overflow-x-hidden">

    <!-- Mobile Top Bar -->
    <div class="lg:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
        <span class="font-bold uppercase tracking-wider text-blue-400">E-com Admin</span>
        <button id="menuBtn" class="text-2xl focus:outline-none">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="flex h-screen relative">
        <!-- Sidebar -->
        <div id="sidebar"
            class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 ease-in-out flex flex-col shrink-0">
            <div
                class="p-6 text-2xl font-bold border-b border-slate-700 uppercase tracking-wider text-blue-400 flex justify-between items-center">
                STHUB ADMIN PANEL
                <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="flex-1 mt-4">
                <a href="dashboard.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition"><i
                        class="fas fa-chart-line mr-3 w-5"></i> Dashboard</a>
                <a href="index.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition"><i
                        class="fas fa-plus-circle mr-3 w-5"></i> Add Product</a>
                <a href="products.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition"><i
                        class="fas fa-box mr-3 w-5"></i> All Products</a>
                <a href="orders.html" class="flex items-center px-6 py-3 bg-blue-600 text-white shadow-lg"><i
                        class="fas fa-shopping-cart mr-3 w-5"></i> Orders</a>
                <a href="messages.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-comment-dots mr-3 w-5"></i> Messages
                </a>
            </nav>
        </div>

        <!-- Overlay -->
        <div id="overlay" class="fixed inset-0 bg-black opacity-50 z-40 hidden lg:hidden"></div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto p-4 md:p-10">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800 tracking-tight">Customer Orders</h1>
                <button onclick="location.reload()"
                    class="w-full md:w-auto bg-white p-2 px-6 rounded-xl shadow-sm border border-gray-200 hover:bg-gray-50 transition text-sm font-bold text-gray-600 flex items-center justify-center">
                    <i class="fas fa-sync-alt mr-2 text-blue-500"></i> Refresh List
                </button>
            </div>

            <!-- Loading Spinner -->
            <div id="loader" class="text-center py-20 hidden">
                <div
                    class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent">
                </div>
                <p class="mt-4 text-gray-500 font-semibold italic">Loading order data...</p>
            </div>

            <!-- Orders Table Container -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[800px]">
                        <thead class="bg-gray-50 border-b border-gray-100">
                            <tr>
                                <th class="px-6 py-4 text-[10px] font-black uppercase text-gray-400 tracking-widest">
                                    Order ID</th>
                                <th class="px-6 py-4 text-[10px] font-black uppercase text-gray-400 tracking-widest">
                                    Customer</th>
                                <th class="px-6 py-4 text-[10px] font-black uppercase text-gray-400 tracking-widest">
                                    Shipping Address</th>
                                <th class="px-6 py-4 text-[10px] font-black uppercase text-gray-400 tracking-widest">
                                    Product Details</th>
                                <th class="px-6 py-4 text-[10px] font-black uppercase text-gray-400 tracking-widest">
                                    Total Price</th>
                                <th
                                    class="px-6 py-4 text-[10px] font-black uppercase text-gray-400 tracking-widest text-center">
                                    Status</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody" class="divide-y divide-gray-50">

                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Mobile Info Alert -->
            <p class="lg:hidden text-center text-xs text-gray-400 mt-4 italic">
                <i class="fas fa-info-circle mr-1"></i> Swipe left to see more order details
            </p>
        </div>
    </div>

    <!-- Mobile Menu Script -->
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeSidebar = document.getElementById('closeSidebar');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeSidebar.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>

    <script type="module" src="orders.js"></script>
</body>

</html>
