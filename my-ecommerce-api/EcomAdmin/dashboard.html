<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-com Admin - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans overflow-x-hidden">

    <div class="lg:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
        <span class="font-bold uppercase tracking-wider text-blue-400">E-com Admin</span>
        <button id="menuBtn" class="text-2xl focus:outline-none">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="flex h-screen relative">

        <div id="sidebar"
            class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 ease-in-out flex flex-col shrink-0">
            <div
                class="p-6 text-2xl font-bold border-b border-slate-700 uppercase tracking-wider text-blue-400 flex justify-between items-center">
                STHUB ADMIN PANEL
                <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="flex-1 mt-4">
                <a href="dashboard.html" class="flex items-center px-6 py-3 bg-blue-600 text-white shadow-lg"><i
                        class="fas fa-chart-line mr-3 w-5"></i> Dashboard</a>
                <a href="index.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition"><i
                        class="fas fa-plus-circle mr-3 w-5"></i> Add Product</a>
                <a href="products.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition"><i
                        class="fas fa-box mr-3 w-5"></i> All Products</a>
                <a href="orders.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition"><i
                        class="fas fa-shopping-cart mr-3 w-5"></i> Orders</a>
                <a href="messages.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-comment-dots mr-3 w-5"></i> Messages
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700">
                <button id="logoutBtn"
                    class="w-full flex items-center px-4 py-2 text-red-400 hover:bg-red-500 hover:text-white rounded-lg transition">
                    <i class="fas fa-sign-out-alt mr-3"></i> Logout
                </button>
            </div>
        </div>

        <div id="overlay" class="fixed inset-0 bg-black opacity-50 z-40 hidden lg:hidden"></div>

        <div class="flex-1 overflow-y-auto p-4 md:p-10">
            <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-6 md:mb-8 tracking-tight">Business Overview
            </h1>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 mb-10">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center">
                    <div class="p-3 bg-green-100 rounded-full text-green-600 mr-4">
                        <i class="fas fa-coins text-xl md:text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-[10px] md:text-sm text-gray-500 font-bold uppercase tracking-wide">Total Revenue
                        </p>
                        <h2 id="totalSalesText" class="text-lg md:text-2xl font-black text-gray-800">LKR 0</h2>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center">
                    <div class="p-3 bg-blue-100 rounded-full text-blue-600 mr-4">
                        <i class="fas fa-shopping-bag text-xl md:text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-[10px] md:text-sm text-gray-500 font-bold uppercase tracking-wide">Total Orders
                        </p>
                        <h2 id="totalOrdersText" class="text-lg md:text-2xl font-black text-gray-800">0</h2>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center">
                    <div class="p-4 bg-orange-100 rounded-full text-orange-600 mr-4">
                        <i class="fas fa-box-open text-xl md:text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-[10px] md:text-sm text-gray-500 font-bold uppercase tracking-wide">All Products
                        </p>
                        <h2 id="totalProductsText" class="text-lg md:text-2xl font-black text-gray-800">0</h2>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 md:gap-8">

                <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg md:text-xl font-bold text-gray-800 italic">Revenue Flow</h2>
                        <span class="text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded">Live</span>
                    </div>
                    <div class="relative h-[250px] md:h-[300px] w-full">
                        <canvas id="salesChart"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b border-gray-50 flex justify-between items-center">
                        <h2 class="text-lg md:text-xl font-bold text-gray-800">Recent Transactions</h2>
                        <a href="orders.html" class="text-blue-500 text-sm font-semibold hover:underline">View All</a>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-50 text-[10px] md:text-xs font-bold text-gray-500 uppercase">
                                <tr>
                                    <th class="px-4 md:px-6 py-4">ID</th>
                                    <th class="px-4 md:px-6 py-4">Product</th>
                                    <th class="px-4 md:px-6 py-4 text-center">Price</th>
                                </tr>
                            </thead>
                            <tbody id="recentOrderTable" class="divide-y divide-gray-50">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeSidebar = document.getElementById('closeSidebar');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeSidebar.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>

</html>
