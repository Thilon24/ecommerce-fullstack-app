<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        .group:hover .group-hover\:opacity-100 {
            opacity: 1;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .user-item:hover {
            background-color: #f1f5f9;
            cursor: pointer;
        }

        .active-user {
            background-color: #e2e8f0;
            border-left: 4px solid #2563eb;

        }
    </style>
</head>

<body class="bg-gray-100 font-sans">

    <div class="flex h-screen">
        <aside class="w-64 bg-slate-900 shadow-xl hidden md:flex flex-col">
            <div class="p-6 text-white text-2xl font-bold">Admin Panel</div>
            <nav class="flex-1 mt-4">
                <a href="dashboard.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-chart-line mr-3 w-5"></i> Dashboard
                </a>
                <a href="index.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-plus-circle mr-3 w-5"></i> Add Product
                </a>
                <a href="products.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-box mr-3 w-5"></i> All Products
                </a>
                <a href="orders.html"
                    class="flex items-center px-6 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-shopping-cart mr-3 w-5"></i> Orders
                </a>
                <a href="messages.html"
                    class="flex items-center justify-between px-6 py-3 bg-blue-600 text-white shadow-lg">
                    <div class="flex items-center">
                        <i class="fas fa-comment-dots mr-3 w-5"></i> Messages
                    </div>

                    <span id="msgCount"
                        class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">0</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm p-4 px-8 font-semibold text-gray-800 text-lg">Customer Support Chat
            </header>

            <div class="flex-1 flex overflow-hidden p-6 gap-6">
                <div class="w-1/3 bg-white rounded-xl shadow-md flex flex-col border border-gray-200 overflow-hidden">
                    <div class="p-4 border-b bg-gray-50 font-bold text-gray-700">Recent Chats</div>
                    <div id="userChatList" class="flex-1 overflow-y-auto custom-scrollbar">
                    </div>
                </div>

                <div class="flex-1 bg-white rounded-xl shadow-md flex flex-col border border-gray-200 overflow-hidden">
                    <div id="chatHeader" class="p-4 border-b bg-gray-50 font-bold text-gray-700">Select a User</div>
                    <div id="messageDisplay"
                        class="flex-1 p-6 overflow-y-auto bg-slate-50 flex flex-col gap-3 custom-scrollbar">
                        <p class="text-center text-gray-400 mt-20">Click on a user to start chatting</p>
                    </div>
                    <div id="chatInputArea" class="p-4 border-t bg-white hidden">
                        <div class="flex gap-2">
                            <input id="adminReplyInput" type="text" placeholder="Type a message..."
                                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            <button id="btnSendReply"
                                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="message.js"></script>
</body>

</html>
